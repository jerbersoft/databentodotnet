name: Bug
description: Something behaves incorrectly
title: "[area] Short description of the wrong behavior"
labels: ["type: bug"]
body:
  - type: textarea
    id: bluf
    attributes:
      label: BLUF
      description: One or two sentences — what is wrong and what it breaks.
      placeholder: The FSM drops the final record when a read lands exactly on a record boundary, silently truncating every stream that ends cleanly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, or the failing test.
    validations:
      required: true

  - type: textarea
    id: upstream
    attributes:
      label: Upstream comparison
      description: What does databento-rs do here? Cite the file and line if you checked.
