name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet packages
        run: dotnet pack -c Release --no-build -o nupkg

      - name: Install NuGet Credential Provider
        run: |
          mkdir -p ~/.nuget/plugins/netcore
          cd ~/.nuget/plugins/netcore
          wget -q https://github.com/microsoft/artifacts-credprovider/releases/download/v2.0.4/Microsoft.linux-x64.NuGet.CredentialProvider.tar.gz
          tar xzf Microsoft.linux-x64.NuGet.CredentialProvider.tar.gz
          chmod +x plugins/netcore/CredentialProvider.Microsoft/CredentialProvider.Microsoft
        shell: bash

      - name: Publish to NuGet
        env:
          NUGET_CREDENTIALPROVIDERS_PATH: ~/.nuget/plugins/netcore/plugins/netcore
        run: dotnet nuget push "nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
