name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet packages
        run: dotnet pack -c Release --no-build -o nupkg

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: jerbersoft

      - name: Publish to NuGet
        run: dotnet nuget push "nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: List packages on NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in DatabentoDotNet.Dbn DatabentoDotNet.Live DatabentoDotNet.Historical DatabentoDotNet.Reference; do
            echo "Listing package: $package"
            curl -X POST \
              -H "X-NuGet-ApiKey: $NUGET_API_KEY" \
              https://www.nuget.org/api/v2/package/$package/0.1.0-alpha
          done
