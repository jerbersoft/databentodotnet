name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

# What this release publishes, and what it deliberately holds back.
#
# Two lists rather than one, because `dotnet pack` at the root packs every shipping project and the
# set of projects that *ship* is not always the set that *publishes* at a given version. HELD is
# empty today and the list is not decoration: 0.10.0 is the release where a fifth package appeared,
# and the push was a `nupkg/*.nupkg` glob while this line named four — so the glob would have been
# publishing more than the pre-flight and the verification below ever checked. It happened to be
# the right thing to publish. Nobody had decided that.
#
# The partition step is what makes these lists load-bearing: a .nupkg in neither list fails the
# run, and a PACKAGES entry that was not packed fails it too. A sixth package therefore arrives as
# a decision somebody records here, rather than as one that silently ships or silently does not.
#
# FIRST_PUBLISH is the third list and the newest (#103). It names the ids in PACKAGES that have
# never been published at any version, and it exists because nuget.org will not answer the question
# it stands in for: whether the Trusted Publishing policy behind this run's credential covers a
# package id that does not exist yet. It does not, until somebody widens it in a browser, and #102
# found that out by getting a 403 partway through a push — one package live on the feed depending on
# a sibling that had not been pushed yet. An id on the feed at no version stops the run unless it is
# named here, and an id named here that is already on the feed stops the run too, so the list cannot
# quietly go stale. tools/publish-preflight.sh carries the full argument, including why the endpoint
# that looks like it should answer this cannot.
env:
  PACKAGES: DatabentoDotNet.Dbn DatabentoDotNet.Live DatabentoDotNet.Historical DatabentoDotNet.Reference DatabentoDotNet.Extensions.Hosting
  HELD: ""
  FIRST_PUBLISH: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Pack NuGet packages
        run: dotnet pack -c Release --no-build -o nupkg

      # The version comes from what was packed, never from a literal written here. This step used to
      # be a hardcoded 0.1.0-alpha further down the file, which is a defect that hides rather than
      # fails: at any other version it would operate on a version this run did not produce, and still
      # go green. Reading it back off the artefact makes it impossible for the workflow's idea of the
      # version and the build's to drift.
      - name: Resolve the packed version
        id: packed
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(nupkg/DatabentoDotNet.Dbn.*.nupkg)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one DatabentoDotNet.Dbn .nupkg in nupkg/, found ${#files[@]}."
            ls -la nupkg/ || true
            exit 1
          fi
          version="${files[0]#nupkg/DatabentoDotNet.Dbn.}"
          version="${version%.nupkg}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packed version: $version"

      # Makes PACKAGES and HELD govern the artefacts rather than merely describe them, in both
      # directions: nothing unaccounted for survives to the push, and nothing PACKAGES names may go
      # missing from it. The second loop is what the push step below relies on — it pushes one file
      # per id in PACKAGES by name, so "the file exists" has to have been established here.
      #
      # Held packages are still deleted rather than merely skipped, which is now belt and braces
      # rather than load-bearing: the push cannot reach a file no list names, because it no longer
      # globs. It was load-bearing when it was written, and a package deleted from the runner is one
      # fewer thing a later step can pick up by accident.
      - name: Partition the packed output into published and held
        env:
          VERSION: ${{ steps.packed.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in nupkg/*.nupkg; do
            id="${file#nupkg/}"
            id="${id%.$VERSION.nupkg}"
            if [[ " $PACKAGES " == *" $id "* ]]; then
              echo "$id will be published."
            elif [[ -n "$HELD" && " $HELD " == *" $id "* ]]; then
              echo "$id is held back at $VERSION — removing it and its symbols from nupkg/."
              rm -f "nupkg/$id.$VERSION.nupkg" "nupkg/$id.$VERSION.snupkg"
            else
              echo "::error::$file is named by neither PACKAGES nor HELD. Every packed package has to be one or the other: add it to PACKAGES to publish it, or to HELD with a note saying what it is waiting for. A package id that does not end in .$VERSION.nupkg lands here too, which means it packed at a version this release did not produce."
              exit 1
            fi
          done
          for id in $PACKAGES; do
            if [ ! -f "nupkg/$id.$VERSION.nupkg" ]; then
              echo "::error::PACKAGES names $id but nupkg/$id.$VERSION.nupkg does not exist. It either failed to pack, changed its PackageId, or set IsPackable false."
              exit 1
            fi
          done

      # Everything this release asks nuget.org before it pushes, and the push order it derives from
      # the answers: which ids are new at this version, whether any of them is a package id that does
      # not exist yet, and whether the run would publish anything at all.
      #
      # It is a script rather than a step because a step can only be exercised by publishing
      # something. This file has four pre-flights now and every one of them was added after a
      # release found the defect — a hardcoded version and a no-op run reporting success (#71), a
      # push glob covering more packages than the gates checked (#102), a credential that could not
      # create a new package id (#103). tools/publish-preflight-tests.sh runs every branch of it
      # against a fake feed in under a second, with nothing published and no credential, and CI runs
      # that on every push.
      #
      # It runs before the login on purpose: none of it needs a credential, so a release that is
      # going to be refused is refused without minting a token.
      - name: Ask nuget.org what this release can publish
        id: preflight
        env:
          VERSION: ${{ steps.packed.outputs.version }}
        run: tools/publish-preflight.sh

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: jerbersoft

      # One invocation per package, in the order the pre-flight worked out, rather than one
      # `nupkg/*.nupkg` glob.
      #
      # The order is the point, and it is the half of #103 that does not depend on anybody having
      # remembered anything. FIRST_PUBLISH ids go first, so a Trusted Publishing policy that does not
      # cover a new id fails while nothing has been published — instead of #102, where the glob
      # expanded in directory order, Live went first by accident, and the 403 landed with Live live
      # on the feed declaring a dependency on a Dbn that did not exist.
      #
      # Naming the file gives up nothing the glob was buying, which is a correction: this comment
      # used to claim the opposite. `dotnet nuget push` derives the .snupkg from each .nupkg path it
      # is handed and pushes it after a successful primary push, so the pairing is per-path rather
      # than a property of having been globbed, and symbols still need no separate step. The same
      # `packageWasPushed` gate is why a skipped duplicate skips its symbols, which is the fact the
      # no-op check in the pre-flight rests on. Both read off NuGet.Client's PushPackagePath rather
      # than inferred from a green run.
      #
      # Every id here has a file, because the partition step above fails the run otherwise. A glob
      # could not have said that.
      - name: Publish to NuGet
        env:
          ORDER: ${{ steps.preflight.outputs.order }}
          VERSION: ${{ steps.packed.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          pushed=""
          for id in $ORDER; do
            echo "::group::Pushing $id $VERSION"
            if ! dotnet nuget push "nupkg/$id.$VERSION.nupkg" \
                   --source https://api.nuget.org/v3/index.json \
                   --api-key "$NUGET_API_KEY" \
                   --skip-duplicate; then
              echo "::endgroup::"
              echo "::error::Pushing $id $VERSION failed. If the message above is a 403 naming permission, it is the Trusted Publishing policy rather than the package: the OIDC credential is scoped to a list of package ids, and $id is not on it. Widen the policy for jerbersoft at https://www.nuget.org/account/trustedpublishing, then re-run — --skip-duplicate makes the re-run complete rather than abort on what already went out. Published before this failure:${pushed:- nothing}."
              exit 1
            fi
            echo "::endgroup::"
            pushed="$pushed $id"
          done

      # Verifies that the packages the pre-flight called new actually arrived, reading the public
      # feed rather than trusting the push's exit code.
      #
      # This replaces a step named "List packages on NuGet.org" that POSTed to
      # /api/v2/package/{id}/{version} with the API key. That endpoint does not list anything — it
      # *relists* a version, mutating listing state — and it named a hardcoded 0.1.0-alpha, so at any
      # other version it would have been quietly relisting an old prerelease on every release. A
      # read-only check of the version this run produced is what the step was named for.
      - name: Verify the new versions reached the feed
        env:
          VERSION: ${{ steps.packed.outputs.version }}
          NEW: ${{ steps.preflight.outputs.new }}
        run: |
          set -euo pipefail
          pending="$NEW"
          for attempt in $(seq 1 30); do
            remaining=""
            for id in $pending; do
              lower="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
              if curl -sfL "https://api.nuget.org/v3-flatcontainer/$lower/index.json" -o index.json \
                 && jq -e --arg v "$VERSION" '.versions | index($v) != null' index.json > /dev/null; then
                echo "$id $VERSION is live."
              else
                remaining="$remaining $id"
              fi
            done
            pending="$(echo "$remaining" | xargs || true)"
            [ -z "$pending" ] && break
            echo "Attempt $attempt/30 — still waiting for:$pending"
            sleep 30
          done
          if [ -n "$pending" ]; then
            echo "::error::After 15 minutes these were still not on the feed at $VERSION:$pending. nuget.org validation can lag, so check https://www.nuget.org/profiles/jerbersoft before re-running — a re-run will be refused as a no-op once they do appear."
            exit 1
          fi
          echo "All packages published by this run are live at $VERSION."
