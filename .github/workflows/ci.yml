name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # `Category!=Live` excludes the tests that talk to the real Databento gateway. They are
        # already gated on DATABENTO_API_KEY being present and skip themselves without it, so this
        # filter is the second of two independent guards rather than the only one — and CI is
        # never given the secret, so neither guard is load-bearing alone. See
        # tests/DatabentoDotNet.Live.Tests/LiveCredentials.cs.
        #
        # RealGatewaySessionTests, the one test that starts a session and so moves billable data,
        # sits behind a third gate of its own (DATABENTO_LIVE_SESSION) on top of this category.
        # It is not enough on its own and is not meant to be: this filter is what keeps the whole
        # category out of CI, and that gate is what keeps the billable one out of a local run.
        #
        # `Category!=Historical` excludes the same thing for the real historical API
        # (RealHistoricalApiTests), on the same two-guard argument. Those tests spend nothing —
        # every endpoint they reach is discovery or a billing enquiry — but they are still network
        # calls against a live service with a credential CI does not have. The tests that *do* cost
        # money arrive behind DATABENTO_HISTORICAL_REQUEST, a third gate on top of this category,
        # exactly as DATABENTO_LIVE_SESSION sits on top of Category=Live.
        #
        # The benchmark project is excluded by being IsTestProject=false, not by this filter.
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=Live&Category!=Historical"
