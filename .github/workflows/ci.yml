name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # The release gates, run without releasing anything (#103).
      #
      # publish.yml only runs when a release is published, so until #103 its pre-flights had been
      # exercised exactly four times, each by a defect reaching production. The questions it asks
      # nuget.org now live in tools/publish-preflight.sh, and this runs every branch of them against
      # a fake feed served over file:// — no credential, no network, nothing published, about a
      # second. Linux only: it is bash, curl and jq, and it is release machinery rather than
      # anything the library does on a platform.
      - name: Publish pre-flight tests
        if: runner.os == 'Linux'
        run: tools/publish-preflight-tests.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Report SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # `Category!=Live` excludes the tests that talk to the real Databento gateway. They are
        # already gated on DATABENTO_API_KEY being present and skip themselves without it, so this
        # filter is the second of two independent guards rather than the only one — and CI is
        # never given the secret, so neither guard is load-bearing alone. See
        # tests/DatabentoDotNet.Live.Tests/LiveCredentials.cs.
        #
        # RealGatewaySessionTests, the one test that starts a session and so moves billable data,
        # sits behind a third gate of its own (DATABENTO_LIVE_SESSION) on top of this category.
        # It is not enough on its own and is not meant to be: this filter is what keeps the whole
        # category out of CI, and that gate is what keeps the billable one out of a local run.
        #
        # `Category!=Historical` excludes the same thing for the real historical API
        # (RealHistoricalApiTests), on the same two-guard argument. Those tests spend nothing —
        # every endpoint they reach is discovery or a billing enquiry — but they are still network
        # calls against a live service with a credential CI does not have. The tests that *do* cost
        # money arrive behind DATABENTO_HISTORICAL_REQUEST, a third gate on top of this category,
        # exactly as DATABENTO_LIVE_SESSION sits on top of Category=Live.
        #
        # `Category!=Reference` excludes the M4 equivalent, and here the second guard is doing more
        # work than it does above. RealReferenceApiTests skips itself without DATABENTO_API_KEY like
        # the other two — but the endpoints it calls turn out to be *unauthenticated*, so a runner
        # that reached them without a key would get real answers rather than a 401. Nothing about
        # that is dangerous; it is simply a network call to a third party on every push, made to
        # check whether a vendored fixture is still current, which is not a question CI is asking.
        # RealReferenceRequestTests holds everything that costs money, behind
        # DATABENTO_REFERENCE_REQUEST on top of this category.
        #
        # The benchmark project is excluded by being IsTestProject=false, not by this filter.
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=Live&Category!=Historical&Category!=Reference"
